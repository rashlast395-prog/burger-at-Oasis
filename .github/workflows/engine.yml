name: engine

on:
  push:
    paths: ["engine/**", "web/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "web/**", ".github/workflows/engine.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck

  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - name: Unit and integration tests
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --release --locked -p bo-server
      - name: End-to-end check of the real programs
        shell: pwsh
        run: ./server/tests/e2e.ps1 -Bin target/release
      - name: Website API smoke test
        shell: pwsh
        run: ./server/tests/api-smoke.ps1 -Bin target/release
      - uses: actions/upload-artifact@v4
        with:
          name: bo-server-linux-x86_64
          path: |
            engine/target/release/bo-server
            engine/target/release/bo-device
            engine/deploy/
          retention-days: 14
